services:

  db:
    image: postgres:17-alpine
    container_name: order-notification-db

    environment:
      POSTGRES_DB: order_notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d order_notification_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: order-notification-backend

    environment:
      DB_URL: jdbc:postgresql://db:5432/order_notification_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: order-notification-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  postgres_data: